name: Auto Cloud Sync to Roblox

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Aftman Tools
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Check rbxcloud universe subcommands
        run: rbxcloud universe --help

      - name: Build and Publish place to Roblox Cloud
        run: |
          rojo build --output game.rbxl
          echo "Waiting for rbxcloud command info..."