name: Auto Cloud Sync to Roblox

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Aftman Tools
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Debug rbxcloud commands
        run: rbxcloud --help

      - name: Build and Push Headless to Roblox Cloud
        run: |
          rojo build --output game.rbxl
          rbxcloud place publish --file game.rbxl --place-id 129122438210317 --universe-id 9969726968 --api-key ${{ secrets.ROBLOX_API_KEY }}