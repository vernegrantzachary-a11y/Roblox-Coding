name: Auto Cloud Sync to Roblox

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Aftman Tools
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust and Install Aftman Tools
        run: aftman install --no-trust-check

      - name: Debug - List files
        run: ls -la

      - name: Build place with Rojo
        run: rojo build default.project.json --output game.rbxl

      - name: Publish place to Roblox Cloud
        run: |
          rbxcloud experience publish \
            --api-key "${{ secrets.ROBLOX_API_KEY }}" \
            --universe-id "${{ secrets.ROBLOX_UNIVERSE_ID }}" \
            --place-id "${{ secrets.ROBLOX_PLACE_ID }}" \
            --version-type published \
            --filename game.rbxl